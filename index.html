:root{
  --red:#DA0500;
  --ink:#111111;
  --ink-2:#4a4a4a;
  --muted:#8a8785;
  --line:#e6e3de;
  --line-2:#f0eeea;
  --bg:#ffffff;
  --sand:#f4f2ee;
  --sand-2:#ebe8e2;
  --display:'Vnachale','Helvetica Neue',Helvetica,Arial,sans-serif;
  --sans:Helvetica,'Helvetica Neue',Arial,sans-serif;
  --gut:16px;
  --head:52px;
  --tick:30px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg);
  font-size:14px;
  line-height:1.45;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}

.wrap{padding-inline:var(--gut)}
.up{text-transform:uppercase;letter-spacing:.12em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);border:0;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.card__buy:hover{background:var(--ink)}
.card__buy:hover svg{stroke:#fff}
.chip:hover{border-color:var(--ink);color:var(--ink)}
main{min-height:60svh}

/* ---------- ticker ---------- */
.ticker{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:var(--tick);background:var(--ink);color:#fff;
  display:flex;align-items:center;overflow:hidden;
  padding-top:env(safe-area-inset-top);
  height:calc(var(--tick) + env(safe-area-inset-top));
}
.ticker__track{display:flex;white-space:nowrap;animation:slide 26s linear infinite;will-change:transform}
.ticker__track span{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding-right:44px;
}
.ticker__track span b{font-weight:400;color:#fff}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker__track{animation:none}}

/* ---------- header ---------- */
.hdr{
  position:fixed;left:0;right:0;z-index:55;
  top:calc(var(--tick) + env(safe-area-inset-top));
  height:var(--head);background:#fff;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-inline:var(--gut);
}
.hdr__l,.hdr__r{display:flex;align-items:center;gap:18px}
.hdr__r{justify-content:flex-end}
.hdr__logo{justify-self:center;display:block}
.hdr__logo img{display:block;height:30px;width:auto}
.burger{width:22px;height:14px;position:relative;display:block}
.burger i{position:absolute;left:0;right:0;height:1.5px;background:var(--ink);transition:.22s}
.burger i:nth-child(1){top:0}
.burger i:nth-child(2){top:6px}
.burger i:nth-child(3){top:12px}
.ico{width:20px;height:20px;stroke:var(--ink);stroke-width:1.4;fill:none}
.cartbtn{position:relative}
.cartbtn b[hidden]{display:none}
.cartbtn b{
  position:absolute;right:-7px;bottom:-4px;min-width:15px;height:15px;border-radius:999px;
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  display:grid;place-items:center;padding:0 3px;line-height:1
}
main{padding-top:calc(var(--tick) + var(--head) + env(safe-area-inset-top))}

/* ---------- menu overlay ---------- */
.menu{
  position:fixed;left:0;right:0;bottom:0;z-index:54;background:#fff;
  top:calc(var(--tick) + var(--head) + env(safe-area-inset-top));
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s
}
.menu.on{opacity:1;visibility:visible}
.menu__body{flex:1;overflow-y:auto;padding:10px var(--gut) 32px;-webkit-overflow-scrolling:touch}
.mgrp{border-bottom:1px solid var(--line-2);padding:4px 0 14px}
.mgrp:last-of-type{border-bottom:0}
.mrow{
  display:block;width:100%;text-align:left;padding:15px 0 9px;
  font-size:22px;line-height:1.1;letter-spacing:-.01em
}
.msub{display:grid;gap:2px;padding-bottom:6px}
.msub a{display:block;padding:8px 0;font-size:14px;color:var(--ink-2)}
.msub a:hover{color:var(--red)}
.msub--fine a{font-size:12.5px;color:var(--muted);padding:6px 0}
.menu__foot{padding:20px var(--gut) calc(26px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:22px}
.menu__foot a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu.on .mgrp{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
.menu.on .mgrp:nth-child(1){animation-delay:.02s}
.menu.on .mgrp:nth-child(2){animation-delay:.06s}
.menu.on .mgrp:nth-child(3){animation-delay:.1s}
.menu.on .mgrp:nth-child(4){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.burger.x i:nth-child(1){top:6px;transform:rotate(45deg)}
.burger.x i:nth-child(2){opacity:0}
.burger.x i:nth-child(3){top:6px;transform:rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.menu.on .mgrp{animation:none}}
@media (min-width:900px){.menu__body{padding-inline:44px}.menu__foot{padding-inline:44px}.mrow{font-size:26px}}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--sand-2);overflow:hidden}
.hero__vp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hero__vp::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:start;height:calc(100svh - var(--tick) - var(--head) - 54px);min-height:420px;max-height:660px}
.slide img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.slide__grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.66) 0%,rgba(0,0,0,.42) 26%,rgba(0,0,0,.08) 55%,rgba(0,0,0,0) 78%)}
.slide__txt{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gut) 26px;color:#fff}
.slide__kick{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
.slide__h{font-family:var(--display);font-size:clamp(34px,10.5vw,54px);line-height:.94;margin:0 0 8px;font-weight:400}
.slide__p{font-size:13px;opacity:.9;margin:0 0 16px;max-width:30ch}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:46px;padding:0 26px;background:var(--ink);color:#fff;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--ink);transition:.16s
}
.btn:active{transform:translateY(1px)}
.btn--red{background:var(--red);border-color:var(--red)}
.btn--ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn--out{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn--wide{width:100%}
.btn--sm{height:38px;padding:0 16px;font-size:10px}
.btn[disabled]{opacity:.35;pointer-events:none}
.hero__arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,.9);
  display:none;place-items:center
}
.hero__arrow svg{width:14px;height:14px;stroke:var(--ink);stroke-width:1.6;fill:none}
.hero__arrow--l{left:10px}
.hero__arrow--r{right:10px}
.hero:hover .hero__arrow,.hero__arrow:focus-visible{display:grid}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:7px;z-index:3}
.dots b{width:22px;height:2px;background:rgba(255,255,255,.4);transition:.2s}
.dots b.on{background:#fff}
@media (min-width:900px){
  .slide{height:min(78vh,720px);max-height:none}
  .slide__txt{padding:0 44px 52px;max-width:660px}
  .hero__arrow{display:grid}
  .dots{bottom:20px}
}

/* ---------- section chrome ---------- */
section{padding:52px 0}
.sec__head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec__t{font-family:var(--sans);font-size:11px;line-height:1;margin:0;font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.sec__more{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sec__more:hover{color:var(--red)}
.h1d{font-family:var(--display);font-weight:400;line-height:.98;margin:0;
  font-size:clamp(32px,9.5vw,54px);letter-spacing:0;text-transform:none}
.h2d{font-family:var(--display);font-weight:400;line-height:1;margin:0;font-size:clamp(24px,6vw,34px)}
@media (min-width:900px){
  section{padding:84px 0}
  .wrap{padding-inline:44px}
}

/* ---------- category rail ---------- */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-inline:var(--gut);margin-inline:calc(var(--gut) * -1)}
.rail::-webkit-scrollbar{display:none}
.cat{position:relative;flex:0 0 61%;scroll-snap-align:start;background:var(--sand);overflow:hidden}
.cat img{width:100%;aspect-ratio:3/4;object-fit:cover}
.cat__n{
  position:absolute;left:0;right:0;bottom:0;padding:14px 12px;color:#fff;
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center
}

@media (min-width:700px){.cat{flex-basis:30%}}
@media (min-width:1100px){.rail{padding-inline:44px;margin-inline:-44px}.cat{flex-basis:23.2%}}

/* ---------- product card ---------- */
.card{display:block}
.card__media{position:relative}
.card__ph{position:relative;background:var(--sand);overflow:hidden}
.card__ph img{width:100%;aspect-ratio:3/4;object-fit:cover;transition:opacity .25s}
img[data-fade]{opacity:0;transition:opacity .45s ease}
img[data-fade].in{opacity:1}
.card__ph img.b{position:absolute;inset:0;opacity:0}
.card:hover .card__ph img.b{opacity:1}
.card__tag{
  position:absolute;top:8px;left:8px;z-index:2;background:var(--red);color:#fff;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:4px 7px
}
.card__tag--n{background:var(--ink)}
.card__buy{
  position:absolute;right:8px;bottom:8px;z-index:2;width:34px;height:34px;border-radius:999px;
  background:#fff;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.14)
}
.card__buy svg{width:14px;height:14px;stroke:var(--ink);stroke-width:1.8;fill:none}
.card__sw{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;gap:4px}
.card__sw i{width:13px;height:13px;border-radius:999px;border:1px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.card__b{padding:10px 0 0}
.card__n{font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;margin-bottom:5px}
.card__p{display:flex;align-items:baseline;gap:8px;font-size:13px}
.card__p s{color:var(--muted);font-size:11px}
.card__p b{font-weight:700}
.card__p b.sale{color:var(--red)}

/* ---------- auto carousel ---------- */
.carousel{position:relative;margin-inline:calc(var(--gut) * -1)}
.carousel__vp{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-inline:var(--gut);-webkit-overflow-scrolling:touch}
.carousel__vp::-webkit-scrollbar{display:none}
.carousel__vp > *{flex:0 0 46%}
@media (min-width:700px){.carousel__vp > *{flex-basis:30%}}
@media (min-width:1100px){
  .carousel{margin-inline:-44px}
  .carousel__vp{padding-inline:44px;gap:14px}
  .carousel__vp > *{flex-basis:22%}
}

/* ---------- preorder banner ---------- */
.pobanner{position:relative;overflow:hidden;background:var(--ink);color:#fff;display:block}
.pobanner img{width:100%;aspect-ratio:16/11;object-fit:cover}
.pobanner::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.66) 38%,rgba(0,0,0,.2) 78%,rgba(0,0,0,.05) 100%)}
.pobanner__t{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gut);gap:10px}
.pobanner__k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#fff;opacity:.8}
.pobanner__h{font-family:var(--display);font-size:clamp(28px,8vw,46px);line-height:.96;margin:0;font-weight:400}
.pobanner__d{font-size:12px;opacity:.85;margin:0}
@media (min-width:900px){.pobanner img{aspect-ratio:21/7}.pobanner__t{padding-inline:44px}}

/* ---------- looks ---------- */
.looks{display:grid;gap:26px}
@media (min-width:900px){.looks{grid-template-columns:repeat(3,1fr);gap:20px}}
.look__ph{display:grid;grid-template-columns:2fr 1fr;gap:4px;background:var(--sand)}
.look__ph .m{aspect-ratio:3/4;object-fit:cover;width:100%;height:100%}
.look__ph .s{display:grid;grid-template-rows:1fr 1fr;gap:4px}
.look__ph .s img{width:100%;height:100%;object-fit:cover}
.look{display:block;width:100%;text-align:left;padding:0}
.look__ph{display:grid;grid-template-columns:2fr 1fr;gap:4px;background:var(--sand)}
.look__b{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0 0}
.look__h{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.look__m{font-size:12px;color:var(--muted)}
.look:hover .look__h{color:var(--red)}

/* ---------- trust ---------- */
/* ---------- manifest ---------- */
.mani{background:var(--ink);color:#fff}
.mani__h{font-family:var(--display);font-size:clamp(30px,9vw,56px);line-height:.95;margin:0 0 18px;font-weight:400}
.mani p{font-size:14px;line-height:1.7;color:#d8d5d0;margin:0 0 14px;max-width:62ch}
.mani .btn{margin-top:10px}

/* ---------- social ---------- */
/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:0 0 calc(30px + env(safe-area-inset-bottom));background:#fff}
.fassure{display:grid;gap:8px;padding:22px 0;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--ink-2);margin-bottom:30px}
@media (min-width:760px){.fassure{grid-template-columns:repeat(3,1fr);gap:18px;padding:20px 0}}
.fcols{display:grid;gap:26px}
@media (min-width:760px){.fcols{grid-template-columns:repeat(4,1fr);gap:20px}}
.fcol h4{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:400}
.fcol a{display:block;padding:5px 0;font-size:12.5px;color:var(--ink-2)}
.fcol a:hover{color:var(--red)}
.fbot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line-2);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:11px;color:var(--muted)}

/* ---------- catalog ---------- */
.subbar{
  position:sticky;top:calc(var(--tick) + var(--head) + env(safe-area-inset-top));z-index:40;
  background:#fff;border-bottom:1px solid var(--line)
}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);padding:8px 14px;
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tools{display:flex;justify-content:space-between;gap:10px;padding:0 var(--gut) 10px}
.tool{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase}
.tool svg{width:13px;height:13px;stroke:var(--ink);stroke-width:1.5;fill:none}
.tool b{width:6px;height:6px;border-radius:999px;background:var(--red);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 10px;padding-top:18px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px 14px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr);gap:26px 14px}}
.count{padding-top:16px;margin:0;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:85;background:#fff;
  transform:translateY(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:86svh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)
}
.sheet.on{transform:none}
.sheet__h{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gut);border-bottom:1px solid var(--line)}
.sheet__h b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.sheet__b{overflow-y:auto;padding:16px var(--gut) 20px}
.sheet__f{padding:12px var(--gut) 16px;border-top:1px solid var(--line);background:#fff}
.x{width:26px;height:26px;display:grid;place-items:center}
.x svg{width:14px;height:14px;stroke:var(--ink);stroke-width:1.5}
@media (min-width:760px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:420px;max-height:none;transform:translateX(101%)}
  .sheet.on{transform:none}
  .sheet--c{border-left:1px solid var(--line)}
}

/* ---------- product page ---------- */
.pdp{display:block}
.gal{position:relative;margin-inline:calc(var(--gut) * -1);background:var(--sand)}
.gal__vp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal__vp::-webkit-scrollbar{display:none}
.gal__vp img{flex:0 0 100%;scroll-snap-align:start;width:100%;aspect-ratio:3/4;object-fit:cover}
.crumbs{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 0 12px}
.crumbs a:hover{color:var(--red)}
.pdp__t{font-family:var(--display);font-size:30px;line-height:1;margin:14px 0 10px;font-weight:400}
.pdp__pr{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.pdp__pr b{font-size:20px}
.pdp__pr b.sale{color:var(--red)}
.pdp__pr s{color:var(--muted);font-size:14px}
.split{font-size:12px;color:var(--ink-2);margin-bottom:20px}
.split b{font-weight:700;color:var(--ink)}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}
.lbl a{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:1px}
.sws{display:flex;gap:9px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:6px 11px 6px 7px;font-size:11px}
.sw i{width:15px;height:15px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw.on{border-color:var(--ink)}
.sizes{display:flex;gap:7px;flex-wrap:wrap}
.size{min-width:48px;height:42px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;letter-spacing:.06em}
.size.on{border-color:var(--ink);background:var(--ink);color:#fff}
.size.off{color:var(--muted);text-decoration:line-through;background:var(--sand);border-style:dashed}
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc__h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:17px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:left}
.acc__h svg{width:11px;height:11px;stroke:var(--ink);stroke-width:1.6;fill:none;transition:transform .2s;flex:0 0 auto}
.acc__h[aria-expanded="true"] svg{transform:rotate(45deg)}
.acc__b{display:none;padding:0 0 20px}
.acc__b.on{display:block}
.acc__b p{margin:0 0 10px;font-size:13px;line-height:1.65;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:12.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.note{background:var(--sand);border-left:2px solid var(--red);padding:12px 14px;font-size:12px;color:var(--ink-2);margin:12px 0 0}
.note b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.buybar{position:sticky;bottom:0;z-index:35;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}
@media (min-width:900px){
  .pdp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:start}
  .gal{margin-inline:0;background:transparent}
  .gal__vp{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:visible}
  .gal__vp img{aspect-ratio:3/4}
  .gal .dots{display:none}
  .pdp__info{align-self:start}
  .pdp__t{font-size:40px}
  .buybar{position:static;border:0;padding:0;margin:0}
}

/* ---------- size table ---------- */
.stab{width:100%;border-collapse:collapse;font-size:12px}
.stab th,.stab td{border-bottom:1px solid var(--line-2);padding:10px 6px;text-align:left}
.stab th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.stab td:first-child{font-weight:700}
.stab td.e{color:var(--line);letter-spacing:.2em}

/* ---------- cart ---------- */
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.ci img{width:64px;aspect-ratio:3/4;object-fit:cover;background:var(--sand)}
.ci__n{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.35}
.ci__m{font-size:11px;color:var(--muted);margin-top:4px}
.ci__p{font-size:13px;white-space:nowrap}
.ci__rm{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.empty{padding:50px 0;text-align:center;color:var(--muted);font-size:13px}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.sum.t{font-size:16px;padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}

/* ---------- preorder page ---------- */
.pohero{background:var(--ink);color:#fff;padding:40px 0 36px;margin-bottom:8px}
.pohero h1{font-family:var(--display);font-size:clamp(34px,11vw,64px);line-height:.94;margin:0 0 14px;font-weight:400}
.pohero p{font-size:13.5px;line-height:1.65;color:#cfcbc6;max-width:52ch;margin:0 0 18px}
.pochip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);padding:8px 14px;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.pochip i{width:6px;height:6px;border-radius:999px;background:var(--red)}
.steps{display:grid;gap:1px;background:var(--line);margin-top:26px}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:#fff;padding:20px var(--gut)}
.step b{display:block;font-family:var(--display);font-size:26px;color:var(--red);line-height:1;margin-bottom:8px}
.step span{font-size:12.5px;color:var(--ink-2)}
@media (min-width:760px){.step{padding:24px}}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:95;
  background:var(--ink);color:#fff;padding:12px 20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:.25s
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

/* ============ утилиты ============ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const byId = id => PRODUCTS.find(p=>p.id===id);
const money = n => n.toLocaleString('ru-RU').replace(/,/g,' ') + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// s = 560px (плитки), l = 1100px (галерея), x = 1600px (первый экран)
function im(key, size){ return key ? 'img/' + key + '-' + (size || 's') + '.jpg' : ''; }
const catName = id => (CATS.find(c=>c.id===id)||{}).name || '';
const inStock = p => p.stock === 'in';
const lowPrice = p => Math.min(...p.variants.map(v=>v.price));
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}

/* ============ корзина ============ */
let CART = [];
try{ CART = JSON.parse(localStorage.getItem('vn_cart')||'[]') }catch(e){ CART = [] }
function saveCart(){ try{ localStorage.setItem('vn_cart', JSON.stringify(CART)) }catch(e){} }
function cartAdd(pid, vi, size){
  const p = byId(pid), v = p.variants[vi];
  const key = pid+'|'+vi+'|'+size;
  const ex = CART.find(i=>i.key===key);
  if(ex) ex.q++; else CART.push({key, pid, vi, size, q:1, price:v.price});
  saveCart(); paintCart(); toast('Добавлено в корзину');
}
function cartRm(key){ CART = CART.filter(i=>i.key!==key); saveCart(); paintCart(); }
const cartQty = () => CART.reduce((s,i)=>s+i.q,0);
const cartSum = () => CART.reduce((s,i)=>s+i.q*i.price,0);

function paintCart(){
  const c = $('#cartcount'), n = cartQty();
  c.hidden = !n; c.textContent = n;
  const b = $('#cartbody'), f = $('#cartfoot');
  if(!CART.length){
    b.innerHTML = '<div class="empty">Пока пусто.<br>Самое время это исправить.</div>';
    f.innerHTML = '<a class="btn btn--out btn--wide" href="#/catalog" data-close>В каталог</a>';
    return;
  }
  b.innerHTML = CART.map(i=>{
    const p = byId(i.pid), v = p.variants[i.vi];
    return `<div class="ci">
      <img src="${im(v.imgs[0],'s')}" alt="" loading="lazy">
      <div>
        <div class="ci__n">${esc(p.name)}</div>
        <div class="ci__m">${esc(v.color)} · размер ${i.size}${i.q>1?' · '+i.q+' шт':''}</div>
        <button class="ci__rm" data-rm="${i.key}">Удалить</button>
      </div>
      <div class="ci__p tnum">${money(i.price*i.q)}</div>
    </div>`;
  }).join('');
  const s = cartSum();
  f.innerHTML = `<div class="sum"><span class="muted">Товары</span><span class="tnum">${money(s)}</span></div>
    <div class="sum"><span class="muted">Доставка</span><span class="tnum">${s>=15000?'бесплатно':'350 ₽'}</span></div>
    <div class="sum t"><b>Итого</b><b class="tnum">${money(s + (s>=15000?0:350))}</b></div>
    <div class="split" style="margin:6px 0 12px">или <b class="tnum">${money(Math.round((s+(s>=15000?0:350))/4))}</b> × 4 платежа</div>
    <button class="btn btn--wide" onclick="toast('Оформление — следующий экран')">Оформить заказ</button>`;
}

/* ============ шторки ============ */
let openSheet = null;
function sheetOpen(id){
  if(openSheet) $(openSheet).classList.remove('on');
  openSheet = '#'+id;
  $(openSheet).classList.add('on');
  $(openSheet).setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on');
  document.body.classList.add('locked');
}
function sheetClose(){
  if(openSheet){ $(openSheet).classList.remove('on'); $(openSheet).setAttribute('aria-hidden','true'); }
  openSheet = null;
  $('#scrim').classList.remove('on');
  document.body.classList.remove('locked');
}
$('#scrim').addEventListener('click', ()=>{ sheetClose(); menuClose(); });
document.addEventListener('click', e=>{
  if(e.target.closest('[data-close]')) sheetClose();
  const rm = e.target.closest('[data-rm]'); if(rm) cartRm(rm.dataset.rm);
});
$('#cartbtn').addEventListener('click', ()=>sheetOpen('cart'));
$('#searchbtn').addEventListener('click', ()=>{ sheetOpen('search'); paintSearch(''); setTimeout(()=>$('#sq').focus(), 260); });
$('#sq').addEventListener('input', e=>paintSearch(e.target.value));
function paintSearch(q){
  const t = q.trim().toLowerCase();
  const list = !t ? PRODUCTS.filter(inStock).slice(0,6)
    : PRODUCTS.filter(p => (p.name+' '+p.variants.map(v=>v.color).join(' ')+' '+catName(p.cat)).toLowerCase().includes(t));
  $('#sres').innerHTML = (!t ? '<div class="lbl"><span>Популярное</span></div>' : '')
    + (list.length ? list.map(p=>`<a class="ci" href="#/p/${p.id}" data-close style="grid-template-columns:52px 1fr auto">
        <img src="${im(p.variants[0].imgs[0],'s')}" alt="" loading="lazy" style="width:52px">
        <div><div class="ci__n">${esc(p.name)}</div><div class="ci__m">${catName(p.cat)}${p.stock==='preorder'?' · предзаказ':''}</div></div>
        <div class="ci__p tnum">${money(lowPrice(p))}</div></a>`).join('')
      : '<div class="empty">Ничего не нашлось.<br>Попробуйте «костюм», «худи», «брюки».</div>');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ sheetClose(); menuClose(); } });

let toastT;
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('on'), 1900);
}

/* ============ карточка товара (плитка) ============ */
function cardHTML(p){
  const v = p.variants[0];
  const ci = p.card || 0;
  const a1 = v.imgs[ci] || v.imgs[0];
  const a2 = v.imgs[ci + 1] || v.imgs[0];
  const price = lowPrice(p);
  const old = v.old;
  const tag = p.stock==='preorder'
    ? '<span class="card__tag">Предзаказ</span>'
    : (old ? '<span class="card__tag card__tag--n">−'+Math.round((1-price/old)*100)+'%</span>' : '');
  const sw = p.variants.length>1
    ? '<span class="card__sw">'+p.variants.map(x=>`<i style="background:${x.hex}"></i>`).join('')+'</span>' : '';
  return `<article class="card">
    <div class="card__media">
      <a class="card__ph" href="#/p/${p.id}">
        ${tag}
        <img src="${im(a1,'s')}" alt="${esc(p.name)}" loading="lazy">
        ${a2!==a1?`<img class="b" src="${im(a2,'s')}" alt="" loading="lazy">`:''}
      </a>
      ${sw}
      <button class="card__buy" data-pick="${p.id}" aria-label="Купить ${esc(p.name)}">
        <svg viewBox="0 0 14 14"><path d="M7 1v12M1 7h12"/></svg>
      </button>
    </div>
    <a class="card__b" href="#/p/${p.id}">
      <div class="card__n">${esc(p.name)}</div>
      <div class="card__p tnum">
        <b class="${old?'sale':''}">${money(price)}</b>
        ${old?`<s>${money(old)}</s>`:''}
      </div>
    </a>
  </article>`;
}

function viewCatalog(q){
  const cat  = q.get('c') || 'all';
  const size = q.get('s') || '';
  const sort = q.get('sort') || 'new';

  let list = PRODUCTS.filter(p=>cat==='all' || p.cat===cat);
  if(size) list = list.filter(p=>p.sizes.includes(size) && !p.out.includes(size));
  if(sort==='cheap') list = [...list].sort((a,b)=>lowPrice(a)-lowPrice(b));
  if(sort==='rich')  list = [...list].sort((a,b)=>lowPrice(b)-lowPrice(a));

  const nF = (size?1:0) + (cat!=='all'?1:0);

  return `
  <div class="subbar">
    <div class="chips">
      <a class="chip ${cat==='all'?'on':''}" href="#/catalog${size?'?s='+size:''}">Все · ${PRODUCTS.length}</a>
      ${CATS.map(c=>`<a class="chip ${cat===c.id?'on':''}" href="#/catalog?c=${c.id}${size?'&s='+size:''}">${c.name} · ${PRODUCTS.filter(p=>p.cat===c.id).length}</a>`).join('')}
    </div>
    <div class="tools">
      <button class="tool" id="fbtn">
        <svg viewBox="0 0 14 14"><path d="M1 3h12M3 7h8M5.5 11h3"/></svg>Фильтры${nF?' <b></b>':''}
      </button>
      <button class="tool" id="sbtn">
        Сортировка: ${sort==='cheap'?'дешевле':sort==='rich'?'дороже':'новинки'}
        <svg viewBox="0 0 14 14"><path d="M3 5l4 4 4-4"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap">
    <h1 class="count">${cat==='all'?'Весь каталог':catName(cat)} — ${list.length} ${plural(list.length,'модель','модели','моделей')}${size?', размер '+size:''}</h1>
    <div class="grid">${list.map(cardHTML).join('') || '<div class="empty" style="grid-column:1/-1">В этом размере сейчас ничего нет.<br>Снимите фильтр или напишите нам — привезём.</div>'}</div>
  </div>
  <div style="height:40px"></div>`;
}

function viewProduct(id, q){
  const p = byId(id);
  if(!p) return '<div class="wrap"><div class="empty">Товар не найден</div></div>';
  const vi = Math.min(+(q.get('v')||0), p.variants.length-1);
  const v  = p.variants[vi];
  const cur = q.get('size') || '';

  const sizes = p.sizes.map(s=>{
    const off = p.out.includes(s);
    const href = `#/p/${p.id}?v=${vi}&size=${s}`;
    return off
      ? `<span class="size off" title="Нет в наличии">${s}</span>`
      : `<a class="size ${cur===s?'on':''}" href="${href}">${s}</a>`;
  }).join('');

  const goes = p.goesWith.map(byId).filter(Boolean);

  return `
  <div class="wrap">
    <div class="crumbs"><a href="#/catalog">Каталог</a> / <a href="#/catalog?c=${p.cat}">${catName(p.cat)}</a> / ${esc(p.name)}</div>
    <div class="pdp">
      <div class="gal">
        <div class="gal__vp" id="galVp">
          ${v.imgs.map(u=>`<img src="${im(u,'l')}" alt="${esc(p.name)} — ${esc(v.color)}" loading="lazy">`).join('')}
        </div>
        <div class="dots" id="galDots" style="bottom:10px">${v.imgs.map((_,i)=>`<b class="${i?'':'on'}" style="background:${i?'rgba(0,0,0,.18)':'var(--ink)'}"></b>`).join('')}</div>
      </div>

      <div class="pdp__info">
        <h1 class="pdp__t">${esc(p.name)}</h1>
        <div class="pdp__pr tnum">
          <b class="${v.old?'sale':''}">${money(v.price)}</b>
          ${v.old?`<s>${money(v.old)}</s>`:''}
        </div>
        <div class="split">или <b class="tnum">${money(Math.round(v.price/4))}</b> × 4 платежа · Яндекс Сплит</div>

        ${p.stock==='preorder' ? `<div class="note"><b>Предзаказ</b>Поступление ${p.eta} 2026 года. Списываем оплату сразу, отправляем в день поступления. Если срок сдвинется — вернём деньги по первому слову.</div><div style="height:18px"></div>`:''}

        ${p.variants.length>1 ? `
        <div class="lbl"><span>Цвет: ${esc(v.color)}</span></div>
        <div class="sws">
          ${p.variants.map((x,i)=>`<a class="sw ${i===vi?'on':''}" href="#/p/${p.id}?v=${i}${cur?'&size='+cur:''}"><i style="background:${x.hex}"></i>${esc(x.color)}</a>`).join('')}
        </div>`:''}

        <div class="lbl"><span>Размер</span><a href="#" data-sg>Размерная сетка</a></div>
        <div class="sizes">${sizes}</div>

        <div class="buybar" style="margin-top:22px">
          <button class="btn btn--wide" data-add="${p.id}|${vi}" ${cur?'':'disabled'}>
            ${cur ? (p.stock==='preorder'?'Оформить предзаказ · '+cur : 'Купить · размер '+cur) : 'Выберите размер'}
          </button>
        </div>

        <div class="note" style="margin-top:14px">
          <b>Нужны данные</b>Рост и размер модели с фото не вынесены отдельной строкой. Для части товаров они уже есть — мелким шрифтом на размерной карточке. Эту строку надо поднять сюда, под кнопку, по всем моделям.
        </div>

        <div style="height:26px"></div>

        <div class="acc"><button class="acc__h" aria-expanded="true">Описание <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10"/></svg></button>
          <div class="acc__b on"><p>${esc(v.desc && v.desc.length > 60 ? v.desc : p.about)}</p></div></div>

        <div class="acc"><button class="acc__h" aria-expanded="false">Характеристики <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10"/></svg></button>
          <div class="acc__b"><dl class="dl">${p.spec.map(([k,val])=>`<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join('')}<dt>Цвет</dt><dd>${esc(v.color)}</dd><dt>Размеры</dt><dd>${p.sizes.join(' · ')}</dd></dl></div></div>

        <div class="acc"><button class="acc__h" aria-expanded="false">Параметры размеров <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10"/></svg></button>
          <div class="acc__b">${sizeTable(p)}</div></div>

        <div class="acc"><button class="acc__h" aria-expanded="false">Состав и уход <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10"/></svg></button>
          <div class="acc__b"><p>${esc(p.comp)}</p><dl class="dl">${p.care.map(c=>`<dt>·</dt><dd>${esc(c)}</dd>`).join('')}</dl></div></div>

        <div class="acc"><button class="acc__h" aria-expanded="false">Оплата и доставка <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10"/></svg></button>
          <div class="acc__b">
            <dl class="dl">
              <dt>Ozon</dt><dd>2–4 дня · 350 ₽</dd>
              <dt>Яндекс</dt><dd>2–5 дней · 350 ₽</dd>
              <dt>СДЭК</dt><dd>3–6 дней · 390 ₽</dd>
              <dt>От 15 000 ₽</dt><dd>бесплатно</dd>
            </dl>
            <p style="margin-top:12px">Оплата картой или Яндекс Сплит — 4 платежа без переплаты. Обмен и возврат 14 дней.</p>
          </div></div>
      </div>
    </div>
  </div>

  <section class="wrap">
    <div class="sec__head">
      <h2 class="sec__t">С этим носят</h2>
      <span class="sec__more">Готовый комплект</span>
    </div>
    <div class="grid" style="padding-top:0">${goes.map(cardHTML).join('')}</div>
    <div class="look__sum" style="border-top:1px solid var(--line);margin-top:20px">
      <span class="muted up" style="font-size:10px">Комплект целиком</span>
      <b class="tnum">${money(v.price + goes.reduce((s,x)=>s+lowPrice(x),0))}</b>
    </div>
  </section>
  <div style="height:20px"></div>`;
}

function sizeTable(p){
  if(p.chart){
    return `<img src="${im(p.chart,'l')}" alt="Размерная сетка — ${esc(p.name)}" style="width:100%;height:auto;background:var(--sand)">
      <p class="muted" style="font-size:12px;margin-top:12px">Мерки сняты с изделия. Если вы между размерами, берите больший — крой свободный.</p>`;
  }
  return `<table class="stab">
    <thead><tr><th>Размер</th><th>Грудь</th><th>Талия</th><th>Длина</th><th>Рукав</th></tr></thead>

function viewPreorder(){

  const skus = po.reduce((s,p)=>s+p.variants.length,0);
  return `
  <section class="pohero">
    <div class="wrap">
      <span class="pochip"><i></i>Предзаказ открыт</span>
      <h1 style="margin-top:18px">Новая<br>коллекция</h1>

    </div>
  </section>

  <div class="wrap">
    <div class="steps">
      <div class="step"><b>01</b><span>Выбираете модель, цвет и размер. Оплачиваете как обычный заказ.</span></div>

function viewAbout(){
  return `<section class="wrap" style="max-width:720px">
    <h1 class="h1d" style="margin:20px 0 22px">Философия бренда</h1>
    <p style="font-size:15px;line-height:1.75;color:var(--ink-2)">Мы верим, что мужественность не нужно изобретать заново и подстраивать под чужие ожидания. Задолго до трендов и навязанных ролей мужчина находил опору в своей природе и способности создавать, защищать, брать ответственность и оставаться верным себе.</p>
    <p style="font-size:15px;line-height:1.75;color:var(--ink-2)">Настоящая сила не нуждается в доказательствах, потому что она проявляется в поступках, а не в навязанных образах. Она чувствуется в уверенности, спокойствии и способности оставаться верным себе при любых обстоятельствах.</p>
    <h2 class="h2d" style="margin:38px 0 14px">Исходный код</h2>
    <p style="font-size:15px;line-height:1.75;color:var(--ink-2)">Долгое время статус ассоциировался со строгими силуэтами, формальной одеждой и необходимостью соответствовать ожиданиям окружающих. Но в современном мире статус больше не нуждается в подобных доказательствах. Комфорт не противоречит статусу, а уверенность не требует строгого дресскода.</p>
    <p style="font-size:15px;line-height:1.75;color:var(--ink-2)">Сила не всегда в усложнении. Мы создаём одежду, которая выглядит премиально не за счёт трендов, а за счёт кроя, материалов и фактуры.</p>
    <div class="note"><b>Что здесь изменилось</b>Все три манифеста с главной переехали сюда — на страницу, которая для них и предназначена. На главной остался один блок из пяти предложений с кнопкой сюда. Заодно исправлены четыре опечатки, которые висели в текстах на боевом сайте.</div>
    <a class="btn btn--out" href="#/catalog" style="margin:26px 0 10px">В каталог</a>
  </section>`;
}

/* ============ роутер ============ */
function route(){
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  const q = new URLSearchParams(qs||'');
  let html = '';
  if(path === '/' || path === '') html = viewHome();
  else if(path === '/catalog') html = viewCatalog(q);
  else if(path.startsWith('/p/')) html = viewProduct(path.slice(3), q);
  else if(path === '/preorder') html = viewPreorder();
  else if(path === '/about') html = viewAbout();
  else if(path === '/info') html = viewInfo();
  else html = '<div class="wrap"><div class="empty">Страница не найдена</div></div>';

  $('#app').innerHTML = html + footerHTML();
  wire(path, q);
  window.scrollTo(0,0);
}

/* ============ обвязка после рендера ============ */
function wire(path, q){
  $$('#app img').forEach(img=>{
    if(img.dataset.faded || img.classList.contains('b')) return;
    img.dataset.faded = '1';
    img.setAttribute('data-fade','');
    const show = () => img.classList.add('in');
    if(img.complete && img.naturalWidth) show();
    else { img.addEventListener('load', show, {once:true}); img.addEventListener('error', show, {once:true}); }
  });

  $$('[data-scroll]').forEach(b=>b.addEventListener('click', ()=>{
    const el = document.getElementById(b.dataset.scroll);
    if(el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - 96, behavior:'smooth'});
  }));

  // аккордеоны
  $$('.acc__h').forEach(b=>b.addEventListener('click', ()=>{
    const body = b.nextElementSibling;
    const open = b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded', String(!open));
    body.classList.toggle('on', !open);
  }));

  // покупка из плитки
  $$('[data-pick]').forEach(b=>b.addEventListener('click', e=>{
    e.preventDefault(); openPick(b.dataset.pick);
  }));

  // добавить с карточки товара
  $$('[data-add]').forEach(b=>b.addEventListener('click', ()=>{
    const [pid, vi] = b.dataset.add.split('|');
    const size = new URLSearchParams((location.hash.split('?')[1]||'')).get('size');
    if(!size) return;
    cartAdd(pid, +vi, size);
  }));

  // размерная сетка
  $$('[data-sg]').forEach(a=>a.addEventListener('click', e=>{
    e.preventDefault();
    const pid = path.slice(3).split('?')[0];
    $('#sgbody').innerHTML = sizeTable(byId(pid) || PRODUCTS[0]);
    sheetOpen('sizeguide');
  }));

  // образы
  $$('[data-look]').forEach(b=>b.addEventListener('click', ()=>openLook(+b.dataset.look)));

  if(path === '/' || path === '') { heroInit(); carouselInit(); }
  if(path.startsWith('/p/')) galInit();
  if(path === '/catalog') catalogInit(q);
}

/* ---- слайдер главной ---- */
function heroInit(){
  const vp = $('#heroVp'), dots = $$('#heroDots b');
  if(!vp) return;
  let i = 0, timer;
  const go = n => { i = (n + dots.length) % dots.length; vp.scrollTo({left: i*vp.clientWidth, behavior:'smooth'}); };
  const paint = () => { const k = Math.round(vp.scrollLeft / vp.clientWidth); i = k; dots.forEach((d,j)=>d.classList.toggle('on', j===k)); };
  vp.addEventListener('scroll', ()=>{ clearTimeout(timer); timer = setTimeout(paint, 60); }, {passive:true});
  $$('[data-hero]').forEach(b=>b.addEventListener('click', e=>{ e.preventDefault(); go(i + +b.dataset.hero); }));
  clearInterval(window.__heroAuto);
  window.__heroAuto = setInterval(()=>{ if(document.body.contains(vp)) go(i+1); else clearInterval(window.__heroAuto); }, 7000);
  vp.addEventListener('pointerdown', ()=>clearInterval(window.__heroAuto), {passive:true});
  clearTimeout(window.__heroRz);
  window.__heroRz = null;
  const onRz = () => { if(!document.body.contains(vp)) return window.removeEventListener('resize', onRz);
    vp.scrollLeft = i * vp.clientWidth; };
  window.addEventListener('resize', onRz);
}

/* ---- авто-карусель товаров ---- */
function carouselInit(){
  const vp = $('#carVp');
  if(!vp) return;
  let paused = false, raf;
  const half = () => vp.scrollWidth / 2;
  // скорость в пикселях в секунду, а не на кадр — одинаково на 60 и 120 Гц
  const SPEED = 26;
  let prev = 0, acc = 0;
  const tick = (ts) => {
    const dt = prev ? Math.min((ts - prev) / 1000, 0.1) : 0;
    prev = ts;
    if(!paused){
      acc += SPEED * dt;
      const step = Math.floor(acc);
      if(step){ acc -= step; vp.scrollLeft += step; }
      if(vp.scrollLeft >= half()) vp.scrollLeft -= half();
    }
    raf = requestAnimationFrame(tick);
  };
  const stop  = () => { paused = true;  };
  const start = () => { paused = false; };
  ['pointerdown','pointerenter','touchstart','focusin'].forEach(ev=>vp.addEventListener(ev, stop, {passive:true}));
  ['pointerleave','mouseleave'].forEach(ev=>vp.addEventListener(ev, start, {passive:true}));
  vp.addEventListener('pointerup', ()=>setTimeout(start, 2600), {passive:true});
  vp.addEventListener('touchend', ()=>setTimeout(start, 2600), {passive:true});
  if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    raf = requestAnimationFrame(tick);
    new IntersectionObserver(es=>{ paused = !es[0].isIntersecting; }, {threshold:.2}).observe(vp);
  }
  new MutationObserver(()=>{ if(!document.body.contains(vp)) cancelAnimationFrame(raf); })
    .observe($('#app'), {childList:true});
}

/* ---- галерея карточки ---- */
function galInit(){
  const vp = $('#galVp'), dots = $$('#galDots b');
  if(!vp || !dots.length) return;
  let t;
  vp.addEventListener('scroll', ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{
      const k = Math.round(vp.scrollLeft / vp.clientWidth);
      dots.forEach((d,j)=>{ d.classList.toggle('on', j===k); d.style.background = j===k ? 'var(--ink)' : 'rgba(0,0,0,.18)'; });
    }, 60);
  }, {passive:true});
}

/* ---- каталог: фильтры и сортировка ---- */
function catalogInit(q){
  const cat = q.get('c')||'', size = q.get('s')||'', sort = q.get('sort')||'new';
  const mk = (c,s,so) => `#/catalog?` + [c?'c='+c:'', s?'s='+s:'', so&&so!=='new'?'sort='+so:''].filter(Boolean).join('&');

  $('#fbtn').addEventListener('click', ()=>{
    $('#filter .sheet__h b').textContent = 'Фильтры';
    $('#filterbody').innerHTML = `
      <div class="lbl"><span>Размер</span></div>
      <div class="sizes">${SIZES_ALL.map(s=>`<a class="size ${size===s?'on':''}" href="${mk(cat, size===s?'':s, sort)}" data-close>${s}</a>`).join('')}</div>
      <div class="lbl" style="margin-top:26px"><span>Категория</span></div>
      <div class="sizes">
        <a class="size ${!cat?'on':''}" style="min-width:auto;padding:0 14px" href="${mk('', size, sort)}" data-close>Все</a>
        ${CATS.map(c=>`<a class="size ${cat===c.id?'on':''}" style="min-width:auto;padding:0 14px" href="${mk(c.id, size, sort)}" data-close>${c.name}</a>`).join('')}
      </div>
      <div class="note" style="margin-top:26px"><b>Как это работает</b>Товар, которого нет в вашем размере, из выдачи уходит, но в карточке размер остаётся перечёркнутым — так мы видим, какой спрос не закрыт, вместо того чтобы его прятать.</div>`;
    $('#filterfoot').innerHTML = `<a class="btn btn--out btn--wide" href="#/catalog" data-close>Сбросить всё</a>`;
    sheetOpen('filter');
  });

  $('#sbtn').addEventListener('click', ()=>{
    $('#filter .sheet__h b').textContent = 'Сортировка';
    $('#filterbody').innerHTML = `<div class="sizes" style="flex-direction:column;gap:2px">
      ${[['new','Сначала новинки'],['cheap','Сначала дешевле'],['rich','Сначала дороже']].map(([k,l])=>
        `<a class="size ${sort===k?'on':''}" style="width:100%;justify-content:flex-start;padding:0 14px;height:48px;display:flex;align-items:center" href="${mk(cat,size,k)}" data-close>${l}</a>`).join('')}
    </div>`;
    $('#filterfoot').innerHTML = '';
    sheetOpen('filter');
  });
}

/* ---- шторка образа ---- */
function openLook(li){
  const L = LOOKS[li];
  const it = L.items.map(([id,vi,ii])=>({p:byId(id), v:byId(id).variants[vi], vi, ii}));
  const sum = it.reduce((s,x)=>s+x.v.price,0);
  $('#pickttl').textContent = L.n;
  $('#pickbody').innerHTML = it.map(x=>`
    <a class="ci" href="#/p/${x.p.id}?v=${x.vi}" data-close>
      <img src="${im(x.v.imgs[x.ii],'s')}" alt="" loading="lazy">
      <div>
        <div class="ci__n">${esc(x.p.name)}</div>
        <div class="ci__m">${esc(x.v.color)}</div>
      </div>
      <div class="ci__p tnum">${money(x.v.price)}</div>
    </a>`).join('')
    + `<p class="muted" style="font-size:12px;margin-top:14px">Добавим по одной вещи в первом доступном размере — размеры поменяете в корзине.</p>`;
  $('#pickfoot').innerHTML = `<button class="btn btn--wide" data-golook>Добавить образ · ${money(sum)}</button>`;
  $('#pickfoot [data-golook]').addEventListener('click', ()=>{
    it.forEach(x=>{
      const size = x.p.sizes.find(z=>!x.p.out.includes(z));
      cartAdd(x.p.id, x.vi, size);
    });
    sheetClose(); toast('Образ в корзине — ' + it.length + ' вещи');
  });
  sheetOpen('pick');
}

/* ---- шторка выбора размера ---- */
function openPick(pid){
  const p = byId(pid);
  let vi = 0, size = null;
  const paint = () => {
    const v = p.variants[vi];
    $('#pickttl').textContent = p.name;
    $('#pickbody').innerHTML = `
      <div style="display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:start">
        <img src="${im(v.imgs[0],'s')}" alt="" style="width:86px;aspect-ratio:3/4;object-fit:cover;background:var(--sand)">
        <div>
          <div class="pdp__pr tnum" style="margin-bottom:4px"><b class="${v.old?'sale':''}" style="font-size:17px">${money(v.price)}</b>${v.old?`<s>${money(v.old)}</s>`:''}</div>
          <div class="split" style="margin:0">или <b class="tnum">${money(Math.round(v.price/4))}</b> × 4 платежа</div>
          ${p.stock==='preorder'?`<div class="ci__m" style="margin-top:8px;color:var(--red)">Предзаказ · поступление ${p.eta}</div>`:''}
        </div>
      </div>
      ${p.variants.length>1?`
        <div class="lbl"><span>Цвет: ${esc(v.color)}</span></div>
        <div class="sws">${p.variants.map((x,i)=>`<button class="sw ${i===vi?'on':''}" data-v="${i}"><i style="background:${x.hex}"></i>${esc(x.color)}</button>`).join('')}</div>`:''}
      <div class="lbl"><span>Размер</span><a href="#" data-sgp>Размерная сетка</a></div>
      <div class="sizes">${p.sizes.map(s=>p.out.includes(s)
        ? `<span class="size off">${s}</span>`
        : `<button class="size ${size===s?'on':''}" data-s="${s}">${s}</button>`).join('')}</div>
      <a href="#/p/${p.id}?v=${vi}" data-close style="display:inline-block;margin-top:18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink)">Подробно о товаре →</a>`;
    $('#pickfoot').innerHTML = `<button class="btn btn--wide" ${size?'':'disabled'} data-go>${
      size ? (p.stock==='preorder' ? 'Оформить предзаказ' : 'В корзину') + ' · ' + money(v.price) : 'Выберите размер'}</button>`;

    $$('#pickbody [data-v]').forEach(b=>b.addEventListener('click',()=>{ vi = +b.dataset.v; paint(); }));
    $$('#pickbody [data-s]').forEach(b=>b.addEventListener('click',()=>{ size = b.dataset.s; paint(); }));
    $('#pickbody [data-sgp]')?.addEventListener('click', e=>{ e.preventDefault(); $('#sgbody').innerHTML = sizeTable(p); sheetOpen('sizeguide'); });
    $('#pickfoot [data-go]')?.addEventListener('click',()=>{ if(size){ cartAdd(p.id, vi, size); sheetClose(); } });
  };
  paint();
  sheetOpen('pick');
}

/* ============ старт ============ */
$('#tickTrack').innerHTML = Array(6).fill(`<span>${TICKER}</span>`).join('');
paintMenu();
paintCart();
if('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.addEventListener('hashchange', menuClose);
window.addEventListener('hashchange', route);
route();
</script>
